name: Enterprise RAG CI Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  
  # 1. Code Quality & Byte Compilation (Adopted from Portfolio)
  
  code-quality:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff Linter
        run: pip install ruff

      - name: Byte-Compile Entire Codebase (Fast Syntax Verification)
        run: python -m compileall -q app tests ui

      - name: Run Ruff Static Analysis
        run: ruff check --select E9,F63,F7,F82 app/ tests/ ui/

  
  # 2. Automated Security & Guardrail Unit Tests (with Real Postgres Service)
  
  security-and-guardrails:
    name: Enterprise Guardrails & Adversarial Defense Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: rag_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke Test FastAPI Boot (Adopted from Portfolio)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/rag_memory
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_test_key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key' }}
          QDRANT_CLUSTER_ENDPOINT: https://dummy.qdrant.io
          LOGFIRE_IGNORE_NO_CONFIG: "1"
        run: python -c "from app.main import app; print(' FastAPI Boot Verification Succeeded:', app.title)"

      - name: Run Guardrail Red-Teaming Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/rag_memory
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LOGFIRE_IGNORE_NO_CONFIG: "1"
        run: pytest tests/test_guardrails_evals.py -v

  
  # 3. Docker Container Build Verification (Multi-Stage Targets)
  
  docker-verification:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: dummy_ci_password
          REDIS_PASSWORD: dummy_ci_password
          GROQ_API_KEY: dummy_ci_key
          GEMINI_API_KEY: dummy_ci_key
          QDRANT_CLUSTER_ENDPOINT: https://dummy.qdrant.io
        run: docker compose config

      - name: Build Backend Docker Target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          load: true
          tags: enterprise-rag-backend:ci

      - name: Build Frontend Docker Target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          load: true
          tags: enterprise-rag-frontend:ci